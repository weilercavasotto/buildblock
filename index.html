<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BlockLab</title>
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#1a1f2b" />
  </head>
  <body>
    <div id="hint"></div>
    <div id="fps"></div>
    <div id="menu">
      <div id="menu-main">
        <img id="menu-logo" src="/logo-mark.svg" alt="" />
        <h1>BlockLab</h1>
        <p class="tagline">Build it. Drive it.</p>
        <button id="menu-play">Play</button>
      </div>
      <div id="menu-saves" hidden>
        <h2>Saved games</h2>
        <div id="save-list"></div>
        <div id="new-game">
          <input id="new-name" type="text" placeholder="New game name" />
          <button id="new-create" class="primary">New game</button>
        </div>
        <button id="menu-back">Back</button>
      </div>
      <div id="menu-version"></div>
    </div>
    <div id="hud">
      <button id="btn-menu">☰ Menu</button>
      <span class="sep"></span>
      <div id="tools">
        <button id="tool-block">[1] Block</button>
        <button id="tool-wheel">[2] Wheel</button>
        <span class="sep"></span>
        <button id="btn-clear">Clear</button>
      </div>
      <span class="sep"></span>
      <button id="btn-play">▶ Play</button>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
