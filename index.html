<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BuildBlock</title>
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#1a1f2b" />
    <!-- Until main.ts has applied the theme (design tokens as CSS variables) nothing is shown, only the dark page
         colour (= COLORS.surface.vignette, the loading screen background), so no unstyled markup flashes on first load. -->
    <style>
      html {
        background: #0a0e18;
      }
      html:not(.ready) body > * {
        display: none !important;
      }
    </style>
  </head>
  <body>
    <div id="top-left" hidden>
      <button id="btn-menu" title="Back to the main menu" aria-label="Back to the main menu">
        <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M3 10.5 12 3l9 7.5" />
          <path d="M5 9.5V20a1 1 0 0 0 1 1h4v-6h4v6h4a1 1 0 0 0 1-1V9.5" />
        </svg>
      </button>
      <button id="btn-saves" title="Saved games" aria-label="Saved games">
        <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M20 20a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.9a2 2 0 0 1-1.69-.9L9.6 3.9A2 2 0 0 0 7.93 3H4a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2Z" />
        </svg>
      </button>
      <button id="help-button" title="Help (H)" aria-label="Help">
        <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
          <circle cx="12" cy="12" r="10" />
          <line x1="12" y1="11" x2="12" y2="17" />
          <circle cx="12" cy="7.5" r="0.6" fill="currentColor" />
        </svg>
      </button>
    </div>
    <div id="controls-panel" hidden></div>
    <button id="btn-alerts" type="button" title="Alerts" aria-label="Alerts" hidden>
      <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9" />
        <path d="M10.3 21a1.94 1.94 0 0 0 3.4 0" />
      </svg>
      <span id="alerts-badge" hidden></span>
    </button>
    <button id="btn-settings" type="button" title="Settings" aria-label="Settings">
      <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z" />
        <circle cx="12" cy="12" r="3" />
      </svg>
    </button>
    <button id="btn-sound" type="button" aria-label="Sound">
      <svg class="sound-on" viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M11 5 6 9H2v6h4l5 4V5Z" />
        <path d="M15.5 8.5a5 5 0 0 1 0 7" />
        <path d="M19 5a10 10 0 0 1 0 14" />
      </svg>
      <svg class="sound-off" viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M11 5 6 9H2v6h4l5 4V5Z" />
        <path d="m22 9-6 6" />
        <path d="m16 9 6 6" />
      </svg>
    </button>
    <div id="fps"></div>
    <div id="zoom">
      <div class="zoom-panel">
        <button id="zoom-in" title="Zoom in (mouse wheel)" aria-label="Zoom in">+</button>
      </div>
      <div id="zoom-bar" class="zoom-panel">
        <span id="zoom-label" aria-live="off"></span>
        <input id="zoom-slider" type="range" min="0" max="1" aria-label="Zoom" />
      </div>
      <div class="zoom-panel">
        <button id="zoom-out" title="Zoom out (mouse wheel)" aria-label="Zoom out">−</button>
      </div>
    </div>
    <aside id="part-inspector" hidden></aside>
    <div id="loading" role="progressbar" aria-label="Loading" aria-valuemin="0" aria-valuemax="100" hidden>
      <img id="loading-logo" src="/logo-stacked.svg" alt="BuildBlock" />
      <div id="loading-bar"><div id="loading-fill"></div></div>
      <p id="loading-label"></p>
    </div>
    <div id="menu">
      <div id="menu-main">
        <h1><img id="menu-logo" src="/logo-stacked.svg" alt="BuildBlock" /></h1>
        <p class="tagline">Imagine, build, play!</p>
        <button id="menu-play">
          <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M7 4.5v15a1 1 0 0 0 1.5.86l12-7.5a1 1 0 0 0 0-1.72l-12-7.5A1 1 0 0 0 7 4.5z" /></svg>
          Play
        </button>
        <button id="menu-discord" type="button">
          <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M20.317 4.3698a19.7913 19.7913 0 00-4.8851-1.5152.0741.0741 0 00-.0785.0371c-.211.3753-.4447.8648-.6083 1.2495-1.8447-.2762-3.68-.2762-5.4868 0-.1636-.3933-.4058-.8742-.6177-1.2495a.077.077 0 00-.0785-.037 19.7363 19.7363 0 00-4.8852 1.515.0699.0699 0 00-.0321.0277C.5334 9.0458-.319 13.5799.0992 18.0578a.0824.0824 0 00.0312.0561c2.0528 1.5076 4.0413 2.4228 5.9929 3.0294a.0777.0777 0 00.0842-.0276c.4616-.6304.8731-1.2952 1.226-1.9942a.076.076 0 00-.0416-.1057c-.6528-.2476-1.2743-.5495-1.8722-.8923a.077.077 0 01-.0076-.1277c.1258-.0943.2517-.1923.3718-.2914a.0743.0743 0 01.0776-.0105c3.9278 1.7933 8.18 1.7933 12.0614 0a.0739.0739 0 01.0785.0095c.1202.099.246.1981.3728.2924a.077.077 0 01-.0066.1276 12.2986 12.2986 0 01-1.873.8914.0766.0766 0 00-.0407.1067c.3604.698.7719 1.3628 1.225 1.9932a.076.076 0 00.0842.0286c1.961-.6067 3.9495-1.5219 6.0023-3.0294a.077.077 0 00.0313-.0552c.5004-5.177-.8382-9.6739-3.5485-13.6604a.061.061 0 00-.0312-.0286zM8.02 15.3312c-1.1825 0-2.1569-1.0857-2.1569-2.419 0-1.3332.9555-2.4189 2.157-2.4189 1.2108 0 2.1757 1.0952 2.1568 2.419 0 1.3332-.9555 2.4189-2.1569 2.4189zm7.9748 0c-1.1825 0-2.1569-1.0857-2.1569-2.419 0-1.3332.9554-2.4189 2.1569-2.4189 1.2108 0 2.1757 1.0952 2.1568 2.419 0 1.3332-.946 2.4189-2.1568 2.4189Z" /></svg>
          Join our Discord
        </button>
      </div>
      <div id="menu-saves" hidden>
        <h2>Saved games</h2>
        <div id="save-list"></div>
        <div id="menu-actions">
          <button id="menu-back">Back</button>
          <button id="new-open" class="primary">New game</button>
        </div>
      </div>
      <div id="menu-new" hidden>
        <h2>New game</h2>
        <label class="field-label" for="new-name">Name</label>
        <input id="new-name" type="text" />
        <span class="field-label" id="grid-size-label">Grid size</span>
        <div id="grid-size" role="radiogroup" aria-labelledby="grid-size-label"></div>
        <div id="menu-actions-new">
          <button id="new-back">Back</button>
          <button id="new-create" class="primary">Create</button>
        </div>
      </div>
      <div id="menu-credit">Developed by Weiler Cavasotto</div>
      <div id="menu-version"></div>
    </div>
    <div id="top-bar" hidden>
      <div id="mode-switch" class="build-only" role="group"></div>
      <span class="sep build-only"></span>
      <div id="rotate-group" class="build-only" role="group">
        <button id="btn-rotate-left">
          <kbd>A</kbd>
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8" />
            <path d="M3 3v5h5" />
          </svg>
        </button>
        <button id="btn-rotate-right">
          <kbd>D</kbd>
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M21 12a9 9 0 1 1-9-9c2.52 0 4.93 1 6.74 2.74L21 8" />
            <path d="M21 3v5h-5" />
          </svg>
        </button>
        <button id="btn-tilt-up">
          <kbd>W</kbd>
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="m5 12 7-7 7 7" />
            <path d="M12 19V5" />
          </svg>
        </button>
        <button id="btn-tilt-down">
          <kbd>S</kbd>
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M12 5v14" />
            <path d="m19 12-7 7-7-7" />
          </svg>
        </button>
      </div>
      <span class="sep build-only"></span>
      <div id="history-group" class="build-only" role="group" aria-label="History">
        <button id="btn-undo" title="Undo (Ctrl/Cmd+Z)" aria-label="Undo (Ctrl/Cmd+Z)" disabled>
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M9 14 4 9l5-5" />
            <path d="M4 9h10.5a5.5 5.5 0 0 1 5.5 5.5a5.5 5.5 0 0 1-5.5 5.5H11" />
          </svg>
        </button>
        <button id="btn-redo" title="Redo (Ctrl/Cmd+Y)" aria-label="Redo (Ctrl/Cmd+Y)" disabled>
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="m15 14 5-5-5-5" />
            <path d="M20 9H9.5A5.5 5.5 0 0 0 4 14.5A5.5 5.5 0 0 0 9.5 20H13" />
          </svg>
        </button>
      </div>
      <span class="sep build-only"></span>
      <button id="btn-clear" class="build-only">Clear</button>
      <button id="btn-reset" class="play-only" hidden></button>
      <button id="btn-play">▶ Play</button>
      <div id="paint-palette" role="group" hidden></div>
      <div id="play-notice" role="status" hidden></div>
    </div>
    <div id="hotbar">
      <div id="hotbar-label" hidden aria-live="polite"></div>
      <div id="hotbar-slots"></div>
      <span class="sep"></span>
      <button id="catalog-button">
        <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true">
          <rect x="3" y="3" width="7" height="7" rx="1.5" />
          <rect x="14" y="3" width="7" height="7" rx="1.5" />
          <rect x="3" y="14" width="7" height="7" rx="1.5" />
          <rect x="14" y="14" width="7" height="7" rx="1.5" />
        </svg>
      </button>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
