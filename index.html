<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BlockLab</title>
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#1a1f2b" />
  </head>
  <body>
    <div id="top-left" hidden>
      <button id="btn-menu" title="Back to the main menu">☰ Menu</button>
      <button id="help-button" title="Help (H)" aria-label="Help">
        <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
          <circle cx="12" cy="12" r="10" />
          <line x1="12" y1="11" x2="12" y2="17" />
          <circle cx="12" cy="7.5" r="0.6" fill="currentColor" />
        </svg>
      </button>
    </div>
    <div id="corner">
      <div id="fps"></div>
      <div id="zoom">
        <div class="zoom-panel">
          <button id="zoom-in" title="Zoom in (mouse wheel)" aria-label="Zoom in">+</button>
        </div>
        <div id="zoom-bar" class="zoom-panel">
          <span id="zoom-label" aria-live="off"></span>
          <input id="zoom-slider" type="range" min="0" max="1" aria-label="Zoom" />
        </div>
        <div class="zoom-panel">
          <button id="zoom-out" title="Zoom out (mouse wheel)" aria-label="Zoom out">−</button>
        </div>
      </div>
    </div>
    <div id="menu">
      <div id="menu-main">
        <img id="menu-logo" src="/logo-mark.svg" alt="" />
        <h1>BlockLab</h1>
        <p class="tagline">Build it. Drive it.</p>
        <button id="menu-play">Play</button>
      </div>
      <div id="menu-saves" hidden>
        <h2>Saved games</h2>
        <div id="save-list"></div>
        <div id="new-game">
          <input id="new-name" type="text" placeholder="New game name" />
          <button id="new-create" class="primary">New game</button>
        </div>
        <button id="menu-back">Back</button>
      </div>
      <div id="menu-version"></div>
    </div>
    <div id="top-bar" hidden>
      <div class="build-only">
        <button id="btn-undo" title="Undo (Ctrl/Cmd+Z)" disabled>↶ Undo</button>
        <button id="btn-redo" title="Redo (Ctrl/Cmd+Y)" disabled>↷ Redo</button>
      </div>
      <span class="sep build-only"></span>
      <button id="btn-clear" class="build-only">Clear</button>
      <button id="btn-play">▶ Play</button>
    </div>
    <div id="hud">
      <div id="tools">
        <button id="tool-block">[1] Block</button>
        <button id="tool-wheel">[2] Wheel</button>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
